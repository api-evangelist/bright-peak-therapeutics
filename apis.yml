aid: bright-peak-therapeutics
name: Bright Peak Therapeutics
description: 'Bright Peak Therapeutics AG is a clinical-stage biotechnology company
  founded in 2018 and co-located in Allschwil, Switzerland (Switzerland Innovation
  Park Basel Area) and San Diego / Del Mar, California. The company engineers next-generation
  multi-functional immunotherapies for cancer and autoimmune disease, using a protein-engineering
  and site-specific chemical-conjugation platform to build multi-functional PD-1 inhibitors
  and cytokine immunoconjugates that combine novel and clinically validated mechanisms
  in a single molecule. Its lead program, BPT567, is a first-in-class PD1-IL18 immunoconjugate
  that entered a Phase 1/2a clinical trial. The company has raised a USD 90 million
  Series C led by Johnson & Johnson Innovation (JJDC) alongside Versant Ventures,
  RA Capital Management, Fidelity, Qatar Investment Authority, Invus, Venrock, KB Investment,
  Alexandria Venture Investments and Northleaf Capital Partners. Bright Peak is a therapeutics
  developer, not a software company: it publishes a corporate marketing site and no
  public developer program, API, SDK or machine-readable specification.'
